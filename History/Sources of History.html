<!DOCTYPE html>
<html lang="bn" class="dark">
<head>

  <!-- 1. Initial Theme & Font-Size Guard (Prevents FOUC) -->
  <script>
    (() => {
      try {
        const theme = localStorage.getItem('mcq_app_theme');
        if (theme === 'light') {
          document.documentElement.classList.remove('dark');
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#f1f5f9');
        }
        const savedSize = parseInt(localStorage.getItem('mcq_app_font_size'), 10);
        document.documentElement.style.fontSize =
          (!isNaN(savedSize) && savedSize >= 10 && savedSize <= 18 ? savedSize : 14) + 'px';
      } catch {
        document.documentElement.style.fontSize = '14px';
      }
    })();
  </script>

  <!-- 2. Fonts & Tailwind CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>

        extend: {

            bengali: ['"Hind Siliguri"', 'sans-serif'],
            latin: ['"Inter"', 'sans-serif']

            fadeSlideIn: {

          animation: {
            'fade-slide': 'fadeSlideIn 0.22s ease-out forwards'

        }
      }
    };
  </script>

  <!-- 3. Custom Component & Rich Content Styles -->
  <style>
    html {
      font-size: 14px;
      scroll-behavior: smooth;
      transition: font-size 0.15s ease;
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }

    body {
      font-family: 'Hind Siliguri', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .font-latin {
      font-family: 'Inter', sans-serif;
    }

    /* Subtle Custom Scrollbars */
    .custom-scroll::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background-color: rgba(148, 163, 184, 0.35);
      border-radius: 9999px;
    }
    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background-color: rgba(148, 163, 184, 0.55);
    }

    /* Auto-hiding Sub-Navigation Bar */
    #sub-nav-bar {
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s ease;
      will-change: transform, opacity;
    }
    #sub-nav-bar.subbar-hidden {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
    }

    /* Card Rendering Optimization */
    .question-card {
      content-visibility: auto;
      contain-intrinsic-size: auto 320px;
    }
    .explanation-container u {
      text-decoration-thickness: 1.5px;
      text-underline-offset: 3px;
    }

    /* Rich Content Typography, Lists & Tables */
    .rich-content-table-wrap {
      -webkit-overflow-scrolling: touch;
      max-width: 100%;
    }
    .rich-content table {
      width: 100%;

      font-size: 0.92em;

    .rich-content tbody td {
      padding: 0.55rem 0.8rem;

      vertical-align: top;
      line-height: 1.55;
    }

      border-top-color: rgba(51, 65, 85, 0.75);
    }

      background-color: rgba(248, 250, 252, 0.65);
    }

      background-color: rgba(30, 41, 59, 0.45);
    }

      background-color: rgba(99, 102, 241, 0.06);
    }

      background-color: rgba(99, 102, 241, 0.12);
    }
    .rich-content ul {
      list-style-type: disc;
      padding-left: 1.35rem;
    }
    .rich-content ol {
      list-style-type: decimal;
      padding-left: 1.35rem;
    }

      margin-top: 0.375rem;

      background-color: rgba(250, 204, 21, 0.35);
      color: inherit;
      padding: 0 2px;
      border-radius: 3px;
    }
    .dark mark.search-hl {
      background-color: rgba(234, 179, 8, 0.3);
      color: #fef08a;
    }
  </style>
</head>

      const RichParser = {

        sanitize(html) {
          const tpl = document.createElement('template');

          const walk = node => {
            for (const child of Array.from(node.childNodes)) {

        },

        parseMarkdownTable(lines) {
          const splitRow = row => row.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
          const isSeparator = row => /^\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?$/.test(row.trim());

          const headers = splitRow(lines[0]);
          const bodyStart = lines.length > 1 && isSeparator(lines[1]) ? 2 : 1;
          const rows = lines.slice(bodyStart).map(splitRow);

          const thead = `<thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead>`;
          const tbody = rows.length
            ? `<tbody>${rows.map(cols => {
                const cells = headers.map((_, i) => `<td>${cols[i] ?? ''}</td>`).join('');
                return `<tr>${cells}</tr>`;

        parse(input) {

            : String(input);
          if (!raw.trim()) return '';

          const htmlTables = [];
          const tokenized = raw.replace(/<table[\s\S]*?<\/table>/gi, match => {
            const token = `__HTML_TABLE_${htmlTables.length}__`;
            htmlTables.push(this.wrapTable(match.trim()));
            return `\n${token}\n`;
          });

          const blocks = [];
          let bullets = [];
          let mdTable = [];

          const flushBullets = () => {
            if (!bullets.length) return;
            blocks.push(`<ul>${bullets.map(item => `<li class="leading-relaxed">${item}</li>`).join('')}</ul>`);
            bullets = [];

          const flushTable = () => {
            if (!mdTable.length) return;
            blocks.push(
              mdTable.length >= 2
                ? this.parseMarkdownTable(mdTable)
                : `<p class="leading-relaxed">${mdTable[0]}</p>`
            );
            mdTable = [];
          };

          for (const line of tokenized.split(/\r?\n/)) {
            const trimmed = line.trim();
            if (!trimmed) {
              flushBullets();
              flushTable();
              continue;
            }

            const tokenMatch = trimmed.match(/^__HTML_TABLE_(\d+)__$/);
            if (tokenMatch) {
              flushBullets();
              flushTable();
              blocks.push(htmlTables[Number(tokenMatch[1])]);

            }

              flushBullets();
              mdTable.push(trimmed);
              continue;

            if (bulletMatch) {

            } else if (/^<(strong|b)\b[^>]*>[^<]+<\/\1>\s*$/i.test(trimmed)) {

          if (typeof raw === 'object' && !Array.isArray(raw)) {
            const title = String(raw.title || raw.heading || '').trim();
            const content = raw.content || raw.body || raw.text || '';
            return (title || content) ? { title: title || 'More Information:', content } : null;
          }

          const str = Array.isArray(raw) ? raw.join('\n') : String(raw);
          const lines = str.split(/\r?\n/);
          const firstIdx = lines.findIndex(l => l.trim().length > 0);
          if (firstIdx === -1) return null;

          const firstLine = lines[firstIdx].trim();
          const rest = lines.slice(firstIdx + 1).join('\n').trim();
          if (rest && (/^<(strong|b)\b[^>]*>.*<\/\1>$/i.test(firstLine) || /[:：]\s*$/.test(this.stripHtml(firstLine)))) {
            return { title: this.stripHtml(firstLine), content: rest };
          }
          return { title: 'More Information:', content: str };
        }
      };

      /* =====================================================================
         MODULE D: DATA INDEXING & APPLICATION STATE
         ===================================================================== */
      const cloneQuestions = () => structuredClone(QUESTIONS_DATA);

      const questionMap = new Map();
      const subCategoryStats = new Map();
      let totalAllCount = 0;
      let totalPyqCount = 0;

      const buildSearchIndex = q => {
        const optText = Object.values(q.options).map(o => `${o.bn || ''} ${o.en || ''}`).join(' ');
        const contextText = RichParser.stripHtml(q.explanation?.context);
        const analysisText = (q.explanation?.optionAnalysis || []).map(i => RichParser.stripHtml(i.desc)).join(' ');
        const notesText = RichParser.stripHtml(q.explanation?.notes);
        const moreObj = RichParser.normalizeMoreInfo(q.explanation);
        const moreText = moreObj ? `${moreObj.title} ${RichParser.stripHtml(moreObj.content)}` : '';
        return `${q.questionBn} ${q.questionEn || ''} ${optText} ${q.category} ${q.pyqYear || ''} ${contextText} ${analysisText} ${notesText} ${moreText}`.toLowerCase();
      };

      QUESTIONS_DATA.forEach(q => {
        const isPyq = Boolean(q.pyqYear);
        totalAllCount++;
        if (isPyq) totalPyqCount++;

        if (!subCategoryStats.has(q.category)) {
          subCategoryStats.set(q.category, { all: 0, pyq: 0 });
        }
        const stat = subCategoryStats.get(q.category);
        stat.all++;
        if (isPyq) stat.pyq++;
      });

      const subCategoriesList = Array.from(subCategoryStats.keys());

      function rebuildQuestionMap(questions) {
        questionMap.clear();
        questions.forEach(q => {
          q._searchIndex = buildSearchIndex(q);
          q._cachedExplainHtml = null;
          questionMap.set(q.id, q);
        });
      }

      const initialQuestions = cloneQuestions();
      rebuildQuestionMap(initialQuestions);

      const state = {
        questions: initialQuestions,
        filteredCache: null,
        mainCategory: CONFIG.CATEGORY.ALL,
        subCategory: null,
        searchQuery: '',
        answers: Store.getJson(CONFIG.STORAGE.ANSWERS, {}),
        openExplains: {},
        allExplainsOpen: false,
        lastFocusedElement: null,
        theme: Store.get(CONFIG.STORAGE.THEME, 'dark'),
        fontSize: (() => {
          const val = parseInt(Store.get(CONFIG.STORAGE.FONT_SIZE, CONFIG.FONT.DEFAULT), 10);
          return !isNaN(val) && val >= CONFIG.FONT.MIN && val <= CONFIG.FONT.MAX ? val : CONFIG.FONT.DEFAULT;
        })()
      };

      const $ = id => document.getElementById(id);
      const dom = {
        html: document.documentElement,
        themeMeta: document.querySelector('meta[name="theme-color"]'),
        srAnnouncer: $('sr-announcer'),
        toast: $('app-toast'),
        toastIcon: $('app-toast-icon'),
        toastText: $('app-toast-text'),
        btnBackTop: $('btn-back-top'),
        subNavBar: $('sub-nav-bar'),

        themeIcon: $('theme-icon'),
        themeText: $('theme-text'),

        btnMenuDrawer: $('btn-menu-drawer'),
        categoryDrawer: $('category-drawer'),
        categoryBackdrop: $('category-backdrop'),
        btnCategoryClose: $('btn-category-close'),
        categoryList: $('category-list'),
        btnResetProgress: $('btn-reset-progress'),
        btnFontDec: $('btn-font-dec'),
        btnFontReset: $('btn-font-reset'),
        btnFontInc: $('btn-font-inc'),
        btnPaletteOpen: $('btn-palette-open'),
        headerUnansweredBadge: $('header-unanswered-badge'),
        headerGaugeProgress: $('header-gauge-progress'),
        paletteDrawer: $('palette-drawer'),
        paletteBackdrop: $('palette-backdrop'),
        btnPaletteClose: $('btn-palette-close'),
        paletteGrid: $('palette-grid'),
        counterCorrect: $('counter-correct'),
        counterWrong: $('counter-wrong'),
        searchInput: $('search-input'),
        searchKbdHint: $('search-kbd-hint'),
        searchClear: $('search-clear'),
        btnToggleAllExplains: $('btn-toggle-all-explains'),
        iconToggleAll: $('icon-toggle-all'),
        textToggleAll: $('text-toggle-all'),
        filterIndicator: $('filter-indicator'),
        filterCategoryName: $('filter-category-name'),
        btnShowAllCategories: $('btn-show-all-categories'),
        btnClearFiltersEmpty: $('btn-clear-filters-empty'),
        questionsFeed: $('questions-feed'),
        emptyState: $('empty-state')
      };

      let toastTimer = null;
      function showToast(message, iconClass = 'fa-solid fa-circle-info text-indigo-400') {
        clearTimeout(toastTimer);
        dom.toastIcon.className = iconClass;
        dom.toastText.textContent = message;
        dom.toast.classList.remove('opacity-0', 'translate-y-2');
        dom.toast.classList.add('opacity-100', 'translate-y-0');
        toastTimer = setTimeout(() => {
          dom.toast.classList.remove('opacity-100', 'translate-y-0');
          dom.toast.classList.add('opacity-0', 'translate-y-2');
        }, 2200);
      }

      function announce(message) {
        dom.srAnnouncer.textContent = '';
        requestAnimationFrame(() => {
          dom.srAnnouncer.textContent = message;
        });
      }

      /* =====================================================================
         MODULE E: UI RENDERERS & VIEW CONTROLLERS
         ===================================================================== */
      const OPTION_VARIANTS = {
        default: {
          box: 'border-slate-200 dark:border-slate-700/80 bg-slate-50/70 dark:bg-slate-800/80 hover:bg-indigo-50/50 dark:hover:bg-slate-700/60 focus-visible:ring-2 focus-visible:ring-indigo-500 text-slate-700 dark:text-slate-200',
          pill: 'bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300',
          icon: ''
        },
        correct: {
          box: 'border-emerald-500 bg-emerald-50 dark:bg-emerald-950/40 text-emerald-900 dark:text-emerald-100 ring-1 ring-emerald-500',
          pill: 'bg-emerald-500 text-white',
          icon: '<i class="fa-solid fa-circle-check text-emerald-500 text-lg ml-auto flex-shrink-0" aria-hidden="true"></i>'

        wrong: {

          icon: ''

      };

      function getFilteredQuestions() {
        if (state.filteredCache) return state.filteredCache;
        const query = state.searchQuery.trim().toLowerCase();

        state.filteredCache = state.questions.filter(q => {
          if (state.mainCategory === CONFIG.CATEGORY.PYQ && !q.pyqYear) return false;
          if (state.subCategory && q.category !== state.subCategory) return false;
          return !query || q._searchIndex.includes(query);
        });
        return state.filteredCache;
      }

      function applyTheme(theme) {
        state.theme = theme;
        Store.set(CONFIG.STORAGE.THEME, theme);
        const isDark = theme === 'dark';
        dom.html.classList.toggle('dark', isDark);
        dom.themeMeta?.setAttribute('content', isDark ? '#0b1120' : '#f1f5f9');
        dom.themeIcon.className = isDark ? 'fa-solid fa-sun text-amber-400' : 'fa-solid fa-moon text-indigo-500';
        dom.themeText.textContent = isDark ? 'দিন' : 'রাত্রি';
      }

      function applyFontSize(sizePx) {
        const clamped = Math.min(CONFIG.FONT.MAX, Math.max(CONFIG.FONT.MIN, sizePx));
        state.fontSize = clamped;
        dom.html.style.fontSize = `${clamped}px`;
        Store.set(CONFIG.STORAGE.FONT_SIZE, String(clamped));

        const isDefault = clamped === CONFIG.FONT.DEFAULT;
        dom.btnFontReset.title = `ডিফল্ট ফন্ট সাইজ (${CONFIG.FONT.DEFAULT}px) — বর্তমান: ${clamped}px`;
        dom.btnFontReset.className = isDefault
          ? 'w-7 h-7 rounded-md bg-indigo-600 text-white border border-indigo-600 font-bold text-xs flex items-center justify-center transition active:scale-95 cursor-pointer shadow-sm'
          : 'w-7 h-7 rounded-md bg-indigo-50 hover:bg-indigo-100 dark:bg-indigo-950/70 dark:hover:bg-indigo-900/70 text-indigo-700 dark:text-indigo-300 border border-indigo-200 dark:border-indigo-800 font-bold text-xs transition flex items-center justify-center cursor-pointer active:scale-95';

        dom.btnFontDec.disabled = clamped <= CONFIG.FONT.MIN;
        dom.btnFontDec.classList.toggle('opacity-40', clamped <= CONFIG.FONT.MIN);
        dom.btnFontDec.classList.toggle('cursor-not-allowed', clamped <= CONFIG.FONT.MIN);

        dom.btnFontInc.disabled = clamped >= CONFIG.FONT.MAX;
        dom.btnFontInc.classList.toggle('opacity-40', clamped >= CONFIG.FONT.MAX);
        dom.btnFontInc.classList.toggle('cursor-not-allowed', clamped >= CONFIG.FONT.MAX);
      }

      function renderOptionsHtml(q, userChoice) {
        const isAnswered = userChoice !== undefined;
        const query = state.searchQuery;

        return CONFIG.OPTION_KEYS.map(key => {
          const opt = q.options[key];
          const variant = !isAnswered
            ? OPTION_VARIANTS.default
            : key === q.correctKey
              ? OPTION_VARIANTS.correct
              : key === userChoice
                ? OPTION_VARIANTS.wrong
                : OPTION_VARIANTS.muted;

          const statusLabel = !isAnswered
            ? ''
            : key === q.correctKey
              ? ' (সঠিক উত্তর)'
              : key === userChoice
                ? ' (ভুল উত্তর)'
                : '';

          return `
            <div
              data-option-key="${key}"
              data-qid="${q.id}"
              role="button"
              tabindex="${isAnswered ? '-1' : '0'}"
              aria-disabled="${isAnswered}"
              aria-label="Option ${key}: ${RichParser.escapeHtml(opt.bn)}${statusLabel}"
              class="option-item flex items-center gap-3 sm:gap-3.5 p-3 sm:p-4 rounded-xl border transition-all duration-150 focus:outline-none ${isAnswered ? 'cursor-default' : 'cursor-pointer'} ${variant.box}"
            >
              <span class="w-8 h-8 sm:w-9 sm:h-9 rounded-lg font-latin font-bold text-sm sm:text-base flex items-center justify-center flex-shrink-0 transition-colors ${variant.pill}">
                ${key}
              </span>
              <div class="flex-1 min-w-0 break-words text-base sm:text-lg font-medium leading-snug">
                <span class="font-semibold">${RichParser.highlightText(opt.bn, query)}</span>
                ${opt.en ? `<span class="text-slate-500 dark:text-slate-400 font-latin ml-1 text-sm sm:text-base">(${RichParser.highlightText(opt.en, query)})</span>` : ''}
              </div>
              ${variant.icon}
            </div>
          `;
        }).join('');
      }

      function renderExplanationHtml(q) {
        if (q._cachedExplainHtml) return q._cachedExplainHtml;

        const correctOpt = q.options[q.correctKey];
        const contextHtml = RichParser.parse(q.explanation?.context);
        const notesHtml = RichParser.parse(q.explanation?.notes);
        const moreObj = RichParser.normalizeMoreInfo(q.explanation);
        const moreContentHtml = moreObj ? RichParser.parse(moreObj.content) : '';
        const analysisList = q.explanation?.optionAnalysis || [];

        q._cachedExplainHtml = `
          <div class="animate-fade-slide bg-indigo-50/70 dark:bg-[#0b1120] rounded-2xl p-3.5 sm:p-6 border border-indigo-100 dark:border-[#24334d] space-y-4 text-base">
            <!-- Correct Answer Banner -->
            <div class="p-3 sm:p-3.5 rounded-xl bg-emerald-500/10 dark:bg-emerald-500/[0.12] border border-emerald-500/30 flex items-center gap-2.5 text-emerald-800 dark:text-emerald-200">
              <span class="w-6 h-6 rounded-lg bg-emerald-500 text-white flex items-center justify-center text-xs font-latin shadow-sm flex-shrink-0">
                <i class="fa-solid fa-check" aria-hidden="true"></i>
              </span>
              <span class="font-normal text-sm sm:text-base leading-snug min-w-0 break-words">
                সঠিক উত্তর: <strong>(${q.correctKey}) ${RichParser.escapeHtml(correctOpt.bn)}</strong> ${correctOpt.en ? `<span class="text-xs sm:text-sm font-latin opacity-80">(${RichParser.escapeHtml(correctOpt.en)})</span>` : ''}
              </span>
            </div>

            ${contextHtml ? `
              <div class="space-y-1.5">
                <h4 class="font-bold flex items-center gap-1.5 text-xs sm:text-sm uppercase tracking-wide text-indigo-700 dark:text-indigo-300">
                  <i class="fa-solid fa-book-open" aria-hidden="true"></i> বিশ্লেষণ:
                </h4>
                <div class="text-slate-700 dark:text-slate-300 pl-0.5 sm:pl-1 min-w-0 break-words">${contextHtml}</div>
              </div>
            ` : ''}

            ${analysisList.length ? `
              <div class="space-y-2 pt-2 border-t border-indigo-100 dark:border-[#24334d]">
                <h4 class="font-bold flex items-center gap-1.5 text-sm sm:text-base uppercase tracking-wide text-indigo-700 dark:text-indigo-300">
                  <i class="fa-solid fa-list-ul" aria-hidden="true"></i> অন্যান্য বিকল্পগুলির বিশ্লেষণ:
                </h4>
                <div class="grid grid-cols-1 gap-2 pl-0.5 sm:pl-1">
                  ${analysisList.map(item => `
                    <div class="p-3 rounded-xl bg-white/90 dark:bg-[#151f32] border border-slate-200/80 dark:border-[#24334d] leading-relaxed text-slate-700 dark:text-slate-300 flex items-start gap-2">
                      <span class="font-bold font-latin text-indigo-600 dark:text-indigo-400 flex-shrink-0 pt-0.5">(${RichParser.escapeHtml(item.key)})</span>
                      <div class="flex-1 min-w-0 break-words">${RichParser.formatOptionDesc(item.desc)}</div>
                    </div>
                  `).join('')}
                </div>
              </div>
            ` : ''}

            ${notesHtml ? `
              <div class="bg-amber-50/80 dark:bg-amber-950/20 p-3.5 sm:p-4 rounded-xl border border-amber-200/80 dark:border-amber-900/60 space-y-2">
                <h4 class="text-sm sm:text-base font-bold uppercase tracking-wide text-amber-900 dark:text-amber-300 flex items-center gap-1.5">
                  <i class="fa-solid fa-star text-amber-500" aria-hidden="true"></i> কিছু গুরুত্বপূর্ণ তথ্য:
                </h4>
                <div class="text-slate-700 dark:text-slate-300 min-w-0 break-words">${notesHtml}</div>
              </div>
            ` : ''}

            ${moreContentHtml ? `
              <div class="bg-teal-50/80 dark:bg-teal-950/20 p-3.5 sm:p-4 rounded-xl border border-teal-200/80 dark:border-teal-900/60 space-y-2">
                <h4 class="text-sm sm:text-base font-bold uppercase tracking-wide text-teal-900 dark:text-teal-300 flex items-center gap-1.5">
                  <i class="fa-solid fa-lightbulb text-teal-500" aria-hidden="true"></i> ${RichParser.escapeHtml(moreObj.title)}
                </h4>
                <div class="text-slate-700 dark:text-slate-300 min-w-0 break-words">${moreContentHtml}</div>
              </div>
            ` : ''}

            <div class="pt-2 flex justify-center border-t border-slate-200/60 dark:border-[#24334d]">
              <button
                type="button"
                class="btn-collapse-chevron w-10 h-10 rounded-full bg-slate-200/90 hover:bg-slate-300 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 transition flex items-center justify-center shadow-sm cursor-pointer active:scale-95 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
                title="ব্যাখ্যা বন্ধ করুন"
                data-qid="${q.id}"
                aria-label="ব্যাখ্যা বন্ধ করুন"
              >
                <i class="fa-solid fa-chevron-up text-base" aria-hidden="true"></i>
              </button>
            </div>
          </div>
        `;
        return q._cachedExplainHtml;
      }

      function getExplainBtnMeta(qId) {
        if (state.openExplains[qId]) return { text: 'ব্যাখ্যা লুকান', icon: 'fa-solid fa-eye-slash', expanded: 'true' };
        return {
          text: state.answers[qId] !== undefined ? 'ব্যাখ্যা দেখুন' : 'সরাসরি ব্যাখ্যা দেখুন',
          icon: 'fa-solid fa-eye',
          expanded: 'false'
        };
      }

      function createQuestionCard(q, indexNum) {
        const card = document.createElement('article');
        card.id = `q-card-${q.id}`;
        card.className = 'question-card scroll-mt-36 sm:scroll-mt-40 bg-white dark:bg-[#151f32] rounded-2xl border border-slate-200 dark:border-[#24334d] shadow-sm hover:shadow-md p-3.5 sm:p-6 transition-all duration-200';

        const isOpen = Boolean(state.openExplains[q.id]);
        const btnMeta = getExplainBtnMeta(q.id);
        const query = state.searchQuery;

        card.innerHTML = `
          <div class="flex flex-wrap items-center justify-between gap-2 mb-3.5">
            <span class="inline-flex items-center gap-1.5 px-2.5 sm:px-3 py-1 rounded-lg text-xs sm:text-sm font-semibold bg-indigo-50 dark:bg-indigo-950/60 text-indigo-700 dark:text-indigo-300 border border-indigo-200 dark:border-indigo-800">

            <div>
              ${q.pyqYear ? `
                <span class="inline-flex items-center gap-1.5 px-2.5 sm:px-3 py-1 rounded-lg text-xs sm:text-sm font-semibold bg-amber-50 dark:bg-amber-950/60 text-amber-700 dark:text-amber-300 border border-amber-200 dark:border-amber-800 font-latin">
                  <i class="fa-solid fa-clock-rotate-left text-xs" aria-hidden="true"></i> ${RichParser.highlightText(q.pyqYear, query)}
                </span>
              ` : ''}
            </div>
          </div>

          <div class="mb-4 flex items-start gap-2.5 sm:gap-3">
            <span class="inline-flex items-center justify-center min-w-[2.2rem] sm:min-w-[2.4rem] h-8 sm:h-9 px-2 rounded-xl bg-gradient-to-br from-indigo-500 to-indigo-700 text-white font-latin font-bold text-sm sm:text-base shadow-sm shadow-indigo-500/20 ring-1 ring-white/20 flex-shrink-0 select-none">
              ${indexNum}
            </span>
            <div class="flex-1 min-w-0">
              <h2 class="text-lg sm:text-xl font-bold text-slate-900 dark:text-white leading-relaxed pt-0.5 break-words">
                ${RichParser.highlightText(q.questionBn, query)}
              </h2>
              ${q.questionEn ? `<p class="text-sm sm:text-base font-latin font-medium text-slate-500 dark:text-slate-400 mt-1.5 italic break-words">${RichParser.highlightText(q.questionEn, query)}</p>` : ''}
            </div>
          </div>

          <div class="space-y-2.5 mb-4 options-group" role="group" aria-label="উত্তরের বিকল্পসমূহ" data-qid="${q.id}">
            ${renderOptionsHtml(q, state.answers[q.id])}
          </div>

          <div class="pt-2 flex items-center justify-end border-t border-slate-100 dark:border-slate-800">
            <button
              type="button"
              aria-expanded="${btnMeta.expanded}"
              class="btn-toggle-explain text-xs sm:text-sm font-semibold text-indigo-600 dark:text-indigo-400 hover:text-indigo-700 dark:hover:text-indigo-300 py-1.5 px-3 rounded-lg hover:bg-indigo-50 dark:hover:bg-slate-800 transition flex items-center gap-1.5 cursor-pointer active:scale-95 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
              data-qid="${q.id}"
            >
              <i class="${btnMeta.icon} text-indigo-500 text-xs sm:text-sm explain-icon" aria-hidden="true"></i>
              <span class="explain-label">${btnMeta.text}</span>
            </button>
          </div>

          <div class="explanation-container ${isOpen ? '' : 'hidden'} mt-3 pt-3 border-t border-slate-200 dark:border-[#24334d] min-w-0">
            ${isOpen ? renderExplanationHtml(q) : ''}
          </div>
        `;

      }

      function renderCategoryDrawer() {
        const fragment = document.createDocumentFragment();
        const isPyqMode = state.mainCategory === CONFIG.CATEGORY.PYQ;

        const mainBox = document.createElement('div');
        mainBox.className = 'space-y-1.5';

        [
          { key: CONFIG.CATEGORY.ALL, label: CONFIG.CATEGORY_LABELS.ALL, count: totalAllCount, icon: 'fa-solid fa-book-open-reader', color: 'text-indigo-500' },
          { key: CONFIG.CATEGORY.PYQ, label: CONFIG.CATEGORY_LABELS.PYQ, count: totalPyqCount, icon: 'fa-solid fa-clock-rotate-left', color: 'text-amber-500' }
        ].forEach(item => {
          const isMain = state.mainCategory === item.key;
          const isActive = isMain && state.subCategory === null;
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.dataset.mainCategory = item.key;
          btn.setAttribute('aria-pressed', String(isActive));
          btn.className = `w-full text-left px-3 py-2.5 rounded-xl transition flex items-center justify-between text-xs sm:text-sm font-bold cursor-pointer border focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 ${
            isActive
              ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm'
              : isMain
                ? 'bg-indigo-50/90 dark:bg-indigo-950/50 text-indigo-700 dark:text-indigo-300 border-indigo-200 dark:border-indigo-800/80'
                : 'bg-slate-50/70 dark:bg-slate-800/50 text-slate-700 dark:text-slate-200 border-slate-200/70 dark:border-slate-700/60 hover:bg-slate-100 dark:hover:bg-slate-800'
          }`;
          btn.innerHTML = `
            <span class="flex items-center min-w-0 pr-1.5">
              <i class="${item.icon} mr-2 text-xs ${isActive ? 'text-white' : item.color}" aria-hidden="true"></i>
              <span class="truncate">${item.label}</span>
            </span>
            <span class="text-[11px] px-2 py-0.5 rounded-full font-latin font-semibold flex-shrink-0 ${
              isActive ? 'bg-white/20 text-white' : isMain ? 'bg-indigo-100 dark:bg-indigo-900/70 text-indigo-700 dark:text-indigo-200' : 'bg-slate-200/80 dark:bg-slate-700 text-slate-600 dark:text-slate-300'
            }">${item.count}</span>
          `;
          mainBox.appendChild(btn);
        });

        fragment.appendChild(mainBox);

        const divider = document.createElement('div');
        divider.className = 'my-2 border-t border-slate-200 dark:border-[#24334d]';
        fragment.appendChild(divider);

        const subBox = document.createElement('div');
        subBox.className = 'space-y-1';

        subCategoriesList.forEach(subCat => {
          const stat = subCategoryStats.get(subCat) || { all: 0, pyq: 0 };
          const count = isPyqMode ? stat.pyq : stat.all;
          if (!count) return;

          const isSelected = state.subCategory === subCat;
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.dataset.subCategory = subCat;
          btn.setAttribute('aria-pressed', String(isSelected));
          btn.className = `w-full text-left px-3 py-2 rounded-lg transition flex items-center justify-between text-xs sm:text-sm font-semibold cursor-pointer focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 ${
            isSelected ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800'
          }`;
          btn.innerHTML = `
            <span class="truncate pr-1.5">${RichParser.escapeHtml(subCat)}</span>
            <span class="text-[11px] px-2 py-0.5 rounded-full font-latin font-medium flex-shrink-0 ${
              isSelected ? 'bg-white/20 text-white' : 'bg-slate-200/80 dark:bg-slate-700 text-slate-600 dark:text-slate-300'
            }">${count}</span>
          `;
          subBox.appendChild(btn);
        });

        fragment.appendChild(subBox);
        dom.categoryList.replaceChildren(fragment);
      }

      function updateHudAndPalette(filtered = getFilteredQuestions()) {
        let correct = 0;
        let wrong = 0;
        let answered = 0;
        const fragment = document.createDocumentFragment();

        filtered.forEach((q, idx) => {
          const choice = state.answers[q.id];
          let tileStyle = 'bg-white/70 dark:bg-slate-800/70 backdrop-blur-sm text-slate-800 dark:text-slate-100 border-slate-300/60 dark:border-slate-600/50 hover:bg-indigo-500/15 dark:hover:bg-indigo-400/20';

          if (choice !== undefined) {
            answered++;
            if (choice === q.correctKey) {
              correct++;
              tileStyle = 'bg-emerald-500/90 text-white border-emerald-500 shadow-sm shadow-emerald-500/20';
            } else {
              wrong++;
              tileStyle = 'bg-rose-500/90 text-white border-rose-500 shadow-sm shadow-rose-500/20';
            }
          }

          const tile = document.createElement('button');
          tile.type = 'button';
          tile.dataset.targetQid = q.id;
          tile.className = `w-full aspect-square max-w-[2.65rem] mx-auto rounded-lg font-latin font-bold text-xs sm:text-sm border flex items-center justify-center transition active:scale-95 cursor-pointer tabular-nums focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 ${tileStyle}`;
          tile.textContent = idx + 1;
          tile.title = `প্রশ্ন নম্বর ${idx + 1}-এ যান`;
          tile.setAttribute('aria-label', `প্রশ্ন নম্বর ${idx + 1}-এ যান`);
          fragment.appendChild(tile);
        });

        const total = filtered.length;
        const pending = Math.max(0, total - answered);

        dom.headerUnansweredBadge.textContent = pending;
        dom.btnPaletteOpen.title = `প্রশ্ন তালিকা (${pending} টি উত্তর বাকি, মোট ${total} টি)`;
        dom.headerGaugeProgress.style.strokeDashoffset =
          CONFIG.GAUGE_CIRCUMFERENCE * (1 - (total > 0 ? pending / total : 0));

        dom.counterCorrect.textContent = correct;
        dom.counterWrong.textContent = wrong;
        dom.paletteGrid.replaceChildren(fragment);
      }

      function syncCardExplainButton(card, qId) {
        const btn = card.querySelector('.btn-toggle-explain');
        const label = card.querySelector('.explain-label');
        const icon = card.querySelector('.explain-icon');
        if (!btn || !label || !icon) return;
        const meta = getExplainBtnMeta(qId);
        btn.setAttribute('aria-expanded', meta.expanded);
        label.textContent = meta.text;
        icon.className = `${meta.icon} text-indigo-500 text-xs sm:text-sm explain-icon`;
      }

      function syncGlobalExplainButton(filtered = getFilteredQuestions()) {
        const allOpen = filtered.length > 0 && filtered.every(q => Boolean(state.openExplains[q.id]));
        state.allExplainsOpen = allOpen;
        dom.btnToggleAllExplains.setAttribute('aria-pressed', String(allOpen));
        dom.textToggleAll.textContent = allOpen ? 'সব ব্যাখ্যা লুকান' : 'সব ব্যাখ্যা দেখুন';
        dom.iconToggleAll.className = `fa-solid ${allOpen ? 'fa-eye-slash' : 'fa-eye'} text-xs sm:text-sm text-indigo-500`;
      }

      function renderFeed() {
        const filtered = getFilteredQuestions();
        const isFiltered = state.mainCategory !== CONFIG.CATEGORY.ALL || state.subCategory !== null;

        dom.filterIndicator.classList.toggle('hidden', !isFiltered);
        if (isFiltered) {
          const mainLabel = CONFIG.CATEGORY_LABELS[state.mainCategory];
          dom.filterCategoryName.textContent = state.subCategory ? `${mainLabel} › ${state.subCategory}` : mainLabel;
        }

        if (!filtered.length) {
          dom.questionsFeed.replaceChildren();
          dom.emptyState.classList.remove('hidden');
        } else {
          dom.emptyState.classList.add('hidden');
          const fragment = document.createDocumentFragment();
          filtered.forEach((q, idx) => fragment.appendChild(createQuestionCard(q, idx + 1)));
          dom.questionsFeed.replaceChildren(fragment);
        }

        updateHudAndPalette(filtered);
        syncGlobalExplainButton(filtered);
      }

      /* =====================================================================
         MODULE F: INTERACTION HANDLERS & EVENT BINDING
         ===================================================================== */
      function setDrawerOpen(drawer, backdrop, trigger, isOpen, hiddenClass) {
        if (isOpen) {
          state.lastFocusedElement = document.activeElement;
        }
        backdrop.classList.toggle('opacity-0', !isOpen);
        backdrop.classList.toggle('pointer-events-none', !isOpen);
        backdrop.classList.toggle('opacity-100', isOpen);
        drawer.classList.toggle(hiddenClass, !isOpen);
        drawer.setAttribute('aria-hidden', String(!isOpen));
        if (trigger) trigger.setAttribute('aria-expanded', String(isOpen));

        const anyOpen =
          dom.categoryDrawer.getAttribute('aria-hidden') === 'false' ||
          dom.paletteDrawer.getAttribute('aria-hidden') === 'false';
        document.body.classList.toggle('overflow-hidden', anyOpen);

        if (isOpen) {
          requestAnimationFrame(() => drawer.focus());
        } else if (state.lastFocusedElement && typeof state.lastFocusedElement.focus === 'function') {
          state.lastFocusedElement.focus();
          state.lastFocusedElement = null;
        }
      }

      const closeAllDrawers = () => {
        if (dom.categoryDrawer.getAttribute('aria-hidden') === 'false') {
          setDrawerOpen(dom.categoryDrawer, dom.categoryBackdrop, dom.btnMenuDrawer, false, '-translate-x-full');
        }
        if (dom.paletteDrawer.getAttribute('aria-hidden') === 'false') {
          setDrawerOpen(dom.paletteDrawer, dom.paletteBackdrop, dom.btnPaletteOpen, false, 'translate-x-full');
        }
        document.body.classList.remove('overflow-hidden');
      };

      function selectOption(qId, key) {
        if (state.answers[qId] !== undefined) return;
        const card = $(`q-card-${qId}`);
        const q = questionMap.get(qId);
        if (!card || !q) return;

        state.answers[qId] = key;
        Store.setJson(CONFIG.STORAGE.ANSWERS, state.answers);

        const group = card.querySelector('.options-group');
        if (group) group.innerHTML = renderOptionsHtml(q, key);

        syncCardExplainButton(card, qId);
        updateHudAndPalette();

        const isCorrect = key === q.correctKey;
        announce(isCorrect ? `সঠিক উত্তর: ${q.options[key].bn}` : `ভুল উত্তর। সঠিক উত্তর হলো (${q.correctKey}) ${q.options[q.correctKey].bn}`);
      }

      function toggleExplanation(qId, instantJumpBack = false) {
        const card = $(`q-card-${qId}`);
        const q = questionMap.get(qId);
        if (!card || !q) return;

        const nextOpen = !state.openExplains[qId];
        state.openExplains[qId] = nextOpen;

        const container = card.querySelector('.explanation-container');
        const toggleBtn = card.querySelector('.btn-toggle-explain');

        if (nextOpen) {
          container.innerHTML = renderExplanationHtml(q);
          container.classList.remove('hidden');
        } else {
          container.classList.add('hidden');
          container.replaceChildren();
          if (instantJumpBack && toggleBtn) {
            toggleBtn.scrollIntoView({ behavior: 'instant', block: 'center' });
          }
        }

        syncCardExplainButton(card, qId);
        syncGlobalExplainButton();
      }

      function shuffleAll() {
        let answersShifted = false;

        state.questions.forEach(q => {
          const pairs = CONFIG.OPTION_KEYS.map(k => ({ oldKey: k, val: q.options[k] }));
          for (let i = pairs.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [pairs[i], pairs[j]] = [pairs[j], pairs[i]];
          }

          const keyMap = {};
          const shuffledOpts = {};
          pairs.forEach((p, idx) => {
            const newKey = CONFIG.OPTION_KEYS[idx];
            keyMap[p.oldKey] = newKey;
            shuffledOpts[newKey] = p.val;
          });

          q.options = shuffledOpts;
          q.correctKey = keyMap[q.correctKey] || q.correctKey;
          q._cachedExplainHtml = null;

          if (state.answers[q.id] && keyMap[state.answers[q.id]]) {
            state.answers[q.id] = keyMap[state.answers[q.id]];
            answersShifted = true;
          }

          if (Array.isArray(q.explanation?.optionAnalysis)) {
            q.explanation.optionAnalysis.forEach(item => {
              if (keyMap[item.key]) item.key = keyMap[item.key];
            });
            q.explanation.optionAnalysis.sort(
              (a, b) => CONFIG.OPTION_KEYS.indexOf(a.key) - CONFIG.OPTION_KEYS.indexOf(b.key)
            );
          }
        });

        if (answersShifted) Store.setJson(CONFIG.STORAGE.ANSWERS, state.answers);

        for (let i = state.questions.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [state.questions[i], state.questions[j]] = [state.questions[j], state.questions[i]];
        }

        state.filteredCache = null;
        renderFeed();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        showToast('প্রশ্ন ও অপশন শাফেল করা হয়েছে', 'fa-solid fa-shuffle text-indigo-400');
      }

      function resetAllProgress() {
        state.questions = cloneQuestions();
        rebuildQuestionMap(state.questions);
        state.filteredCache = null;
        state.answers = {};
        state.openExplains = {};
        state.allExplainsOpen = false;
        Store.setJson(CONFIG.STORAGE.ANSWERS, {});
        renderFeed();
        closeAllDrawers();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        showToast('সকল উত্তর রিসেট করা হয়েছে', 'fa-solid fa-rotate-left text-rose-400');
      }

      function resetFilters() {
        state.mainCategory = CONFIG.CATEGORY.ALL;
        state.subCategory = null;
        state.searchQuery = '';
        state.filteredCache = null;
        dom.searchInput.value = '';
        dom.searchClear.classList.add('hidden');
        dom.searchKbdHint.classList.remove('sm:hidden');
        renderCategoryDrawer();
        renderFeed();
      }

      function bindEvents() {
        // Question Feed Delegation
        dom.questionsFeed.addEventListener('click', e => {
          const opt = e.target.closest('.option-item');
          if (opt) {
            selectOption(Number(opt.dataset.qid), opt.dataset.optionKey);
            return;
          }
          const chevron = e.target.closest('.btn-collapse-chevron');
          if (chevron) {
            toggleExplanation(Number(chevron.dataset.qid), true);
            return;
          }
          const explainBtn = e.target.closest('.btn-toggle-explain');
          if (explainBtn) {
            toggleExplanation(Number(explainBtn.dataset.qid), false);
          }
        });

        // Keyboard Support on Options (Enter/Space + Arrow Navigation)
        dom.questionsFeed.addEventListener('keydown', e => {
          const opt = e.target.closest('.option-item');
          if (!opt) return;

          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            selectOption(Number(opt.dataset.qid), opt.dataset.optionKey);
            return;
          }

          if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
            const group = opt.closest('.options-group');
            if (!group) return;
            const items = Array.from(group.querySelectorAll('.option-item[tabindex="0"]'));
            const idx = items.indexOf(opt);
            if (idx === -1) return;
            e.preventDefault();
            const nextIdx = e.key === 'ArrowDown' ? (idx + 1) % items.length : (idx - 1 + items.length) % items.length;
            items[nextIdx].focus();
          }
        });

        // Palette Jump
        dom.paletteGrid.addEventListener('click', e => {
          const tile = e.target.closest('button[data-target-qid]');
          if (!tile) return;
          closeAllDrawers();
          const card = $(`q-card-${tile.dataset.targetQid}`);
          if (!card) return;
          card.scrollIntoView({ behavior: 'smooth', block: 'start' });
          card.classList.add('ring-2', 'ring-indigo-500', 'ring-offset-2', 'dark:ring-offset-[#0b1120]');
          setTimeout(() => card.classList.remove('ring-2', 'ring-indigo-500', 'ring-offset-2', 'dark:ring-offset-[#0b1120]'), 1000);
        });

        // Category Drawer Filters
        dom.categoryList.addEventListener('click', e => {
          const mainBtn = e.target.closest('button[data-main-category]');
          if (mainBtn) {
            state.mainCategory = mainBtn.dataset.mainCategory;
            state.subCategory = null;
            state.filteredCache = null;
            renderCategoryDrawer();
            renderFeed();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            return;
          }
          const subBtn = e.target.closest('button[data-sub-category]');
          if (subBtn) {
            const picked = subBtn.dataset.subCategory;
            state.subCategory = state.subCategory === picked ? null : picked;
            state.filteredCache = null;
            closeAllDrawers();
            renderCategoryDrawer();
            renderFeed();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          }
        });

        // Global Action Controls
        dom.btnToggleAllExplains.addEventListener('click', () => {
          const filtered = getFilteredQuestions();
          const nextOpen = !state.allExplainsOpen;
          state.allExplainsOpen = nextOpen;

          filtered.forEach(q => {
            state.openExplains[q.id] = nextOpen;
            const card = $(`q-card-${q.id}`);
            if (!card) return;
            const box = card.querySelector('.explanation-container');
            if (nextOpen) {
              box.innerHTML = renderExplanationHtml(q);
              box.classList.remove('hidden');
            } else {
              box.classList.add('hidden');
              box.replaceChildren();
            }
            syncCardExplainButton(card, q.id);
          });
          syncGlobalExplainButton(filtered);
        });

        dom.btnShuffle.addEventListener('click', shuffleAll);
        dom.btnTheme.addEventListener('click', () => applyTheme(state.theme === 'dark' ? 'light' : 'dark'));

        dom.btnBackTop.addEventListener('click', e => {
          e.preventDefault();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // Font Size & Reset
        dom.btnFontDec.addEventListener('click', () => applyFontSize(state.fontSize - CONFIG.FONT.STEP));
        dom.btnFontReset.addEventListener('click', () => applyFontSize(CONFIG.FONT.DEFAULT));
        dom.btnFontInc.addEventListener('click', () => applyFontSize(state.fontSize + CONFIG.FONT.STEP));
        dom.btnResetProgress.addEventListener('click', resetAllProgress);

        // Drawers Open/Close
        dom.btnMenuDrawer.addEventListener('click', () => {
          closeAllDrawers();
          setDrawerOpen(dom.categoryDrawer, dom.categoryBackdrop, dom.btnMenuDrawer, true, '-translate-x-full');
        });
        dom.btnCategoryClose.addEventListener('click', closeAllDrawers);
        dom.categoryBackdrop.addEventListener('click', closeAllDrawers);

        dom.btnPaletteOpen.addEventListener('click', () => {
          closeAllDrawers();
          setDrawerOpen(dom.paletteDrawer, dom.paletteBackdrop, dom.btnPaletteOpen, true, 'translate-x-full');
        });
        dom.btnPaletteClose.addEventListener('click', closeAllDrawers);
        dom.paletteBackdrop.addEventListener('click', closeAllDrawers);

        dom.btnShowAllCategories.addEventListener('click', () => {
          state.mainCategory = CONFIG.CATEGORY.ALL;
          state.subCategory = null;
          state.filteredCache = null;
          renderCategoryDrawer();
          renderFeed();
        });
        dom.btnClearFiltersEmpty.addEventListener('click', resetFilters);

        // Debounced Search
        let searchTimer = null;
        dom.searchInput.addEventListener('input', e => {
          clearTimeout(searchTimer);
          const val = e.target.value;
          dom.searchClear.classList.toggle('hidden', !val);
          dom.searchKbdHint.classList.toggle('sm:hidden', Boolean(val));
          searchTimer = setTimeout(() => {
            state.searchQuery = val;
            state.filteredCache = null;
            renderFeed();
          }, 150);
        });

        dom.searchClear.addEventListener('click', () => {
          dom.searchInput.value = '';
          state.searchQuery = '';
          state.filteredCache = null;
          dom.searchClear.classList.add('hidden');
          dom.searchKbdHint.classList.remove('sm:hidden');
          renderFeed();
          dom.searchInput.focus();
        });

        // Global Keyboard Shortcuts (Escape to close drawers, '/' to focus search)
        document.addEventListener('keydown', e => {
          if (e.key === 'Escape') {
            closeAllDrawers();
            return;
          }
          if (
            e.key === '/' &&
            document.activeElement !== dom.searchInput &&
            !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName)
          ) {
            e.preventDefault();
            dom.subNavBar.classList.remove('subbar-hidden');
            dom.searchInput.focus();
          }
        });

        // Auto-Hide Sub-Nav on Scroll Down
        let lastScrollY = window.scrollY;
        let ticking = false;
        window.addEventListener('scroll', () => {
          if (ticking) return;
          ticking = true;
          requestAnimationFrame(() => {
            const currentY = window.scrollY;
            const isFocused = dom.subNavBar && dom.subNavBar.contains(document.activeElement);
            if (!document.body.classList.contains('overflow-hidden')) {
              if (currentY <= 30 || isFocused) {
                dom.subNavBar.classList.remove('subbar-hidden');
                lastScrollY = currentY;
              } else if (Math.abs(currentY - lastScrollY) >= 8) {
                dom.subNavBar.classList.toggle('subbar-hidden', currentY > lastScrollY && currentY > 60);
                lastScrollY = currentY;
              }
            }
            ticking = false;
          });
        }, { passive: true });
      }

      /* =====================================================================
         MODULE G: INITIALIZATION
         ===================================================================== */
      function init() {
        applyTheme(state.theme);
        applyFontSize(state.fontSize);
        renderCategoryDrawer();
        bindEvents();
        renderFeed();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
