    /**
     * Application State
     */
    const appState = {
      theme: localStorage.getItem('mcq_app_theme') || 'dark',
      expandedSubjectIds: new Set(),
      searchQuery: ""
    };

    /**
     * DOM Cache
     */
    const dom = {
      html: document.documentElement,
      btnTheme: document.getElementById('btn-theme'),
      themeIcon: document.getElementById('theme-icon'),
      themeText: document.getElementById('theme-text'),
      searchInput: document.getElementById('search-input'),
      searchClear: document.getElementById('search-clear'),
      subjectsContainer: document.getElementById('subjects-container'),
      emptySearch: document.getElementById('empty-search')
    };

    /* Theme Handler */
    function applyTheme(theme) {
      appState.theme = theme;
      localStorage.setItem('mcq_app_theme', theme);
      if (theme === 'dark') {
        dom.html.classList.add('dark');
        dom.themeIcon.className = 'fa-solid fa-sun text-amber-400';
        dom.themeText.innerText = 'দিন';
      } else {
        dom.html.classList.remove('dark');
        dom.themeIcon.className = 'fa-solid fa-moon text-indigo-500';
        dom.themeText.innerText = 'রাত্রি';
      }
    }

    /* Accordion Toggle */
    function toggleSubject(subjectId) {
      if (appState.expandedSubjectIds.has(subjectId)) {
        appState.expandedSubjectIds.delete(subjectId);
      } else {
        appState.expandedSubjectIds.add(subjectId);
      }
      renderSubjects();
    }

    /* Render Main Subject Cards */
    function renderSubjects() {
      const q = appState.searchQuery.trim().toLowerCase();
      dom.subjectsContainer.innerHTML = '';

      let visibleSubjectsCount = 0;

      GK_DATABASE.forEach((subject) => {
        // Filter chapters according to search input
        const matchedChapters = subject.chapters.filter(ch => {
          if (!q) return true;
          return (
            ch.titleBn.toLowerCase().includes(q) ||
            ch.titleEn.toLowerCase().includes(q) ||
            subject.nameBn.toLowerCase().includes(q) ||
            subject.nameEn.toLowerCase().includes(q)
          );
        });

        // Hide subject if nothing matches query
        if (q && matchedChapters.length === 0) {
          return;
        }

        visibleSubjectsCount++;
        const isExpanded = q ? true : appState.expandedSubjectIds.has(subject.id);

        const card = document.createElement('div');
        card.className = "bg-white dark:bg-[#151f32] rounded-2xl border border-slate-200 dark:border-[#24334d] shadow-xs hover:shadow-md transition-all duration-200 overflow-hidden";

        // Subject Header (Clickable accordion trigger)
        const headerBtn = document.createElement('div');
        headerBtn.setAttribute('role', 'button');
        headerBtn.setAttribute('tabindex', '0');
        headerBtn.setAttribute('aria-expanded', isExpanded ? 'true' : 'false');
        headerBtn.className = "p-4 sm:p-5 flex items-center justify-between gap-3.5 cursor-pointer select-none bg-slate-50/50 hover:bg-indigo-50/30 dark:bg-transparent dark:hover:bg-slate-800/40 transition";

        headerBtn.innerHTML = `
          <div class="flex items-center gap-3.5 sm:gap-4 min-w-0">
            <div class="w-11 h-11 sm:w-12 sm:h-12 rounded-2xl bg-indigo-50 dark:bg-slate-800 text-indigo-600 dark:text-indigo-400 border border-indigo-100 dark:border-slate-700/80 flex items-center justify-center text-lg sm:text-xl shadow-xs flex-shrink-0">
              <i class="fa-solid ${subject.icon} ${subject.iconColor}"></i>
            </div>

            <div class="min-w-0">
              <h2 class="text-base sm:text-lg md:text-xl font-bold text-slate-900 dark:text-white leading-tight">
                ${subject.nameBn}
              </h2>
              <p class="text-xs sm:text-sm font-latin font-medium text-slate-500 dark:text-slate-400 truncate mt-0.5">
                ${subject.nameEn}
              </p>
            </div>
          </div>

          <div class="flex items-center gap-2 flex-shrink-0">
            <span class="w-8 h-8 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 flex items-center justify-center transition-transform duration-200 ${isExpanded ? 'rotate-180 bg-indigo-100 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400' : ''}">
              <i class="fa-solid fa-chevron-down text-xs sm:text-sm"></i>
            </span>
          </div>
        `;

        headerBtn.addEventListener('click', () => {
          toggleSubject(subject.id);
        });

        headerBtn.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            toggleSubject(subject.id);
          }
        });

        card.appendChild(headerBtn);

        // Accordion Content (Chapters List)
        if (isExpanded) {
          const bodyContainer = document.createElement('div');
          bodyContainer.className = "border-t border-slate-200 dark:border-[#24334d] bg-slate-50/70 dark:bg-[#0c1322] p-3 sm:p-4";

          const chaptersList = document.createElement('div');
          chaptersList.className = "space-y-2";

          matchedChapters.forEach((ch, idx) => {
            const chItem = document.createElement('a');
            chItem.href = ch.targetUrl;
            chItem.className = "group block bg-white dark:bg-[#151f32] p-3 sm:p-3.5 rounded-xl border border-slate-200 dark:border-slate-700/80 hover:border-indigo-400 dark:hover:border-indigo-500/60 shadow-xs hover:shadow transition-all duration-150";

            chItem.innerHTML = `
              <div class="flex items-center justify-between gap-3">
                <div class="flex items-center gap-3 min-w-0 flex-1">
                  <span class="w-7 h-7 sm:w-8 sm:h-8 rounded-lg bg-indigo-50 dark:bg-slate-800 text-indigo-600 dark:text-indigo-400 font-latin font-bold text-xs sm:text-sm border border-indigo-100 dark:border-slate-700 flex items-center justify-center flex-shrink-0">
                    ${idx + 1}
                  </span>

                  <div class="min-w-0 flex-1">
                    <div class="flex items-center gap-2 flex-wrap">
                      <h3 class="text-xs sm:text-sm md:text-base font-bold text-slate-900 dark:text-slate-100 group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition leading-snug">
                        ${ch.titleBn}
                      </h3>
                    </div>
                    <p class="text-[11px] sm:text-xs font-latin text-slate-500 dark:text-slate-400 truncate mt-0.5">
                      ${ch.titleEn}
                    </p>
                  </div>
                </div>

                <div class="flex items-center gap-2 flex-shrink-0">
                  <span class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-400 dark:text-slate-400 group-hover:bg-indigo-600 group-hover:text-white dark:group-hover:bg-indigo-600 dark:group-hover:text-white flex items-center justify-center transition-all duration-200 border border-slate-200/80 dark:border-slate-700/80 group-hover:border-indigo-600 shadow-2xs group-hover:shadow-xs group-hover:scale-105 active:scale-95">
                    <i class="fa-solid fa-chevron-right text-xs sm:text-sm transition-transform duration-200 group-hover:translate-x-0.5"></i>
                  </span>
                </div>
              </div>
            `;

            chaptersList.appendChild(chItem);
          });

          bodyContainer.appendChild(chaptersList);
          card.appendChild(bodyContainer);
        }

        dom.subjectsContainer.appendChild(card);
      });

      if (visibleSubjectsCount === 0) {
        dom.emptySearch.classList.remove('hidden');
      } else {
        dom.emptySearch.classList.add('hidden');
      }
    }

    /* Event Listeners */
    function initListeners() {
      dom.btnTheme.addEventListener('click', () => {
        applyTheme(appState.theme === 'dark' ? 'light' : 'dark');
      });

      dom.searchInput.addEventListener('input', (e) => {
        const val = e.target.value;
        appState.searchQuery = val;
        if (val.trim()) {
          dom.searchClear.classList.remove('hidden');
        } else {
          dom.searchClear.classList.add('hidden');
        }
        renderSubjects();
      });

      dom.searchClear.addEventListener('click', () => {
        dom.searchInput.value = '';
        appState.searchQuery = '';
        dom.searchClear.classList.add('hidden');
        renderSubjects();
        dom.searchInput.focus();
      });
    }

    /* Initialization */
    function initialize() {
      applyTheme(appState.theme);
      initListeners();
      renderSubjects();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initialize);
    } else {
      initialize();
    }
  </script>
</body>
</html>
